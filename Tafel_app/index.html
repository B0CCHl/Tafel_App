<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafel app</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="tafel.css"> -->
</head>

<body>
    <div>
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <div class="card">
                    <div class="card-header">
                        Tafels
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">Heel veel tafels</h5>
                        <p class="card-text"></p>
                        <form method="get" class="row g-3 align-items-center">
                            <div class="col-auto">
                                <label for="tafelInput" class="col-form-label">Kies je tafel:</label>
                            </div>
                            <div class="col-3">
                                <input type="number" id="tafelInput" name="tafel" class="form-control" min="1"
                                    required aria-label="Tafelnummer">
                            </div>
                            <div class="col-auto">
                                <a href="#" type="submit" class="btn btn-primary" id="tafelKnop" onclick="showTafel()">klik hier om je tafel te zien</a>
                                </button>
                            </div>
                            <div id="tafeloutput"></div>
                        </form>

                    </div>
                </div>
            </div>

            <div class="col">

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>

    <script src="ShowTafel.js"></script>
        

</body>

</html>
